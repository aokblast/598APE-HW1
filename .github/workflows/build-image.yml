name: Docker Image CI

on:
  push:
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: staging

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image
        id: image
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}

  test:
    needs: build
    runs-on: staging

    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull ${{ needs.build.outputs.image }}

      - name: Run tests on HEAD
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ needs.build.outputs.image }} \
            bash -c 'make clean || true; make && ./scripts/performance-test.sh' \
            | tee head.txt

      - name: Run tests on HEAD^
        run: |
          git checkout HEAD^

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ needs.build.outputs.image }} \
            bash -c 'make clean || true; make && ./scripts/performance-test.sh' \
            | tee head-parent.txt

      - name: Comment performance results
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY' > comment.md
          import re

          def parse(filename):
              text = open(filename).read()
              return dict(
                  (name, float(value))
                  for name, value in re.findall(
                      r'(PianoRoom|Globe|Elephant) Runtime:\s*([\d.]+)',
                      text
                  )
              )

          head = parse("head.txt")
          parent = parse("head-parent.txt")

          print("## Performance comparison\n")
          print("| Benchmark | HEAD^ | HEAD | Speedup |")
          print("|---|---:|---:|---:|")

          for name in head:
              speedup = parent[name] / head[name]
              print(
                  f"| {name} | "
                  f"{parent[name]:.3f} ms | "
                  f"{head[name]:.3f} ms | "
                  f"**{speedup:.2f}×** |"
              )
          PY

		curl -L \
		  -X POST \
		  -H "Accept: application/vnd.github+json" \
		  -H "Authorization: Bearer ${{ github.token }}" \
		  -H "X-GitHub-Api-Version: 2022-11-28" \
		  "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
		  -d "$(python3 -c 'import json; print(json.dumps({"body": open("comment.md").read()}))')"
